{% if suggestions %}
<div x-data="sortableChips('frequency', 'repFieldKey')" style="margin-bottom:var(--space-2);">
  <div style="display:flex;gap:var(--space-1);margin-bottom:var(--space-1);">
    <button type="button" :class="sort==='frequency'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('frequency')">Frequency ▾</button>
    <button type="button" :class="sort==='asc'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('asc')">A → Z</button>
    <button type="button" :class="sort==='desc'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('desc')">Z → A</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-1);">
    {% for s in suggestions %}
    <button type="button"
            class="btn btn--ghost text-small"
            data-label="{{ s.label }}"
            data-frequency="{{ s.frequency }}">
      {{ s.label }} <span class="text-muted">×{{ s.frequency }}</span>
    </button>
    {% endfor %}
  </div>
</div>
{% else %}
<p class="text-muted text-small" style="margin-bottom:var(--space-2);">No rep_fields suggestions for this domain yet.</p>
{% endif %}
