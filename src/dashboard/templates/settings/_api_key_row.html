{# Partial: single API key table row — returned by PATCH rename. #}
<tr id="key-row-{{ key.id }}">
  <td class="data-table__cell"><code>{{ key.key_prefix }}…</code></td>
  <td class="data-table__cell">
    <form hx-patch="/dashboard/settings/api-keys/{{ key.id }}"
          hx-target="#key-row-{{ key.id }}" hx-swap="outerHTML"
          class="inline-rename-form">
      <input type="text" name="label" value="{{ key.label }}"
             class="input input--inline" aria-label="Key label" required>
      <button type="submit" class="btn btn--sm btn--ghost">Save</button>
    </form>
  </td>
  <td class="data-table__cell data-table__cell--muted">
    {% if key.last_used_at %}
      {{ key.last_used_at.strftime('%Y-%m-%d') }}
    {% else %}
      Never
    {% endif %}
  </td>
  <td class="data-table__cell">
    <button class="btn btn--sm btn--danger"
            hx-delete="/dashboard/settings/api-keys/{{ key.id }}"
            hx-target="#key-row-{{ key.id }}" hx-swap="outerHTML"
            hx-confirm="Delete this API key? This cannot be undone."
            aria-label="Delete key {{ key.key_prefix }}…">
      Delete
    </button>
  </td>
</tr>
