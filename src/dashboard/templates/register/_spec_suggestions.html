{% if suggestions %}
<div x-data="sortableChips('frequency')">
  <script type="application/json">{{ suggestions | tojson }}</script>
  <div style="display:flex;gap:var(--space-1);margin-bottom:var(--space-2);">
    <button type="button" :class="sort==='frequency'?'btn btn--active btn--sm':'btn btn--secondary btn--sm'"
            @click="setSort('frequency')">Frequency ▾</button>
    <button type="button" :class="sort==='asc'?'btn btn--active btn--sm':'btn btn--secondary btn--sm'"
            @click="setSort('asc')">A → Z</button>
    <button type="button" :class="sort==='desc'?'btn btn--active btn--sm':'btn btn--secondary btn--sm'"
            @click="setSort('desc')">Z → A</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-1);">
    <template x-for="chip in chips" :key="chip.label">
      {# The label wraps inside the chip and the count never does (#484): a ~150-char
         xpath must not set the page's width. #}
      <button type="button" class="btn btn--secondary btn--sm selector-chip" @click="insertChip(chip.label, chip.value)">
        <span class="selector-chip__label" x-text="chip.label"></span><span class="text-muted selector-chip__count" x-text="'×' + chip.frequency"></span>
      </button>
    </template>
  </div>
</div>
{% else %}
<p class="text-muted text-sm">No existing selectors for {% if hostname %}<strong>{{ hostname }}</strong>{% else %}this domain{% endif %}.</p>
{% endif %}
