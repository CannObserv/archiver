{% if suggestions %}
<div x-data="sortableChips('frequency', null, {{ suggestions | tojson }})">
  <div style="display:flex;gap:var(--space-1);margin-bottom:var(--space-2);">
    <button type="button" :class="sort==='frequency'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('frequency')">Frequency ▾</button>
    <button type="button" :class="sort==='asc'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('asc')">A → Z</button>
    <button type="button" :class="sort==='desc'?'btn btn--active':'btn btn--ghost'"
            @click="setSort('desc')">Z → A</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-1);">
    <template x-for="chip in chips" :key="chip.label">
      <button type="button" class="btn btn--ghost text-sm" @click="insertChip(chip.label, chip.value)">
        <span x-text="chip.label"></span>&nbsp;<span class="text-muted" x-text="'×' + chip.frequency"></span>
      </button>
    </template>
  </div>
</div>
{% else %}
<p class="text-muted text-small">No existing selectors for {% if hostname %}<strong>{{ hostname }}</strong>{% else %}this domain{% endif %}.</p>
{% endif %}
