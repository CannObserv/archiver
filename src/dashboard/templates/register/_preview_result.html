{% if errors %}
<div style="background:var(--color-danger-bg,#fff0f0);padding:var(--space-2);border-radius:var(--radius);margin-top:var(--space-2);">
  {% for err in errors %}
  <p class="text-small text-danger">{{ err }}</p>
  {% endfor %}
</div>
{% elif text_preview %}
<div style="background:var(--color-surface-alt,var(--color-surface));padding:var(--space-2);border-radius:var(--radius);margin-top:var(--space-2);">
  {% if suggested_name %}
  <p class="text-small text-muted" style="margin-bottom:var(--space-1);">Suggested name: <strong>{{ suggested_name }}</strong></p>
  {% endif %}
  {% if fingerprint %}
  <p class="text-small text-muted" style="margin-bottom:var(--space-1);">Fingerprint: <code>{{ fingerprint }}…</code></p>
  {% endif %}
  <pre style="white-space:pre-wrap;font-size:0.8rem;max-height:10rem;overflow:auto;">{{ text_preview }}</pre>
</div>
{% else %}
<p class="text-muted text-small">No content extracted.</p>
{% endif %}
