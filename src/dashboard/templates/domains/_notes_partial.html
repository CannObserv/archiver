<div id="notes-section">
  <h2 style="margin-bottom:var(--space-2);">Notes</h2>
  <form hx-post="/dashboard/domains/{{ domain.name }}/notes"
        hx-target="#notes-section"
        hx-swap="outerHTML"
        style="display:flex;flex-direction:column;gap:var(--space-2);max-width:40rem;">
    <textarea name="notes" class="input" rows="3"
              placeholder="Operator notes about this domain…">{{ domain.notes or '' }}</textarea>
    <div>
      <button type="submit" class="btn btn--primary">Save notes</button>
    </div>
  </form>
</div>
