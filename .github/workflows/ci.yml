name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main (keep
# CI signal for every commit that lands on the protected branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm install
        run: npm install

      - name: npm run lint
        run: npm run lint

      - name: npm test
        run: npm test

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --group dev

      # Independent migration smoke-check; conftest also runs upgrade inside
      # the session fixture (idempotent at head).
      - name: alembic upgrade head
        env:
          ARCHIVER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test
        run: uv run alembic upgrade head

      - name: pytest (default, excludes integration)
        run: uv run pytest -v -m "not integration"

      - name: pytest (integration)
        run: uv run pytest -v -m integration

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: require CHANGELOG.md on contract-visible changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HAS_OPT_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Path-based trigger — mirrors scripts/check_changelog_lib.sh TRIGGER RE.
          # A CHANGELOG.md entry is required only when a contract-visible path changes:
          #   alembic/versions/  deployed DB migrations
          #   src/api/routes/    HTTP API surface
          #   clients/python/    archiver-client SDK
          # Dashboard, tests, docs, tooling changes never require an entry.
          TRIGGER_RE='^(alembic/versions/|src/api/routes/|clients/python/)'
          ZERO=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HAS_OPT_OUT" == "true" ]]; then
              echo "no-changelog label set; skipping"
              exit 0
            fi
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
            if [[ "$base" == "$ZERO" || -z "$base" ]]; then
              echo "no prior SHA on push (initial or force-with-lease edge); skipping"
              exit 0
            fi
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          if printf '%s\n' "$changed_files" | grep -Eq "$TRIGGER_RE"; then
            if ! printf '%s\n' "$changed_files" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Contract-visible path changed without a CHANGELOG.md entry."
              echo "Matched trigger paths:"
              printf '%s\n' "$changed_files" | grep -E "$TRIGGER_RE" | sed 's/^/  /'
              echo
              echo "Update CHANGELOG.md, or apply the 'no-changelog' label (PR only)."
              exit 1
            fi
          fi
          echo "changelog check OK"
