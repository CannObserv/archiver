name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # WIF: let the lint/test jobs mint an OIDC token for
  # google-github-actions/auth to impersonate the read-only co-pypi-reader SA
  # and pull the cannobserv wheelhouse (archiver#72/#75). The changelog job
  # overrides this with its own block, so it never gains id-token.
  id-token: write

# Cancel superseded runs on the same PR; never cancel runs on main (keep
# CI signal for every commit that lands on the protected branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      # co-core / co-core-aio resolve from a wheelhouse mirrored from the
      # private GCS index (archiver#72/#75). Authenticate keyless via Workload
      # Identity Federation — the read-scoped `github-ci` provider impersonating
      # the objectViewer-only co-pypi-reader SA — then sync before `uv sync`.
      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse
        run: uv run --no-project --with google-cloud-storage python scripts/sync_wheelhouse.py

      - name: uv sync
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # pyproject [project].version must equal the newest ## vX.Y.Z heading in
      # CHANGELOG.md (the source of truth) — catches the #85 silent drift that
      # left /openapi.json reporting a stale version. Stdlib-only.
      - name: check version lockstep (pyproject vs CHANGELOG)
        run: uv run --no-project --python 3.12 python scripts/check_version_lockstep.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm install
        run: npm install

      - name: npm run lint
        run: npm run lint

      - name: npm test
        run: npm test

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      # co-core / co-core-aio resolve from a wheelhouse mirrored from the
      # private GCS index (archiver#72/#75). Authenticate keyless via Workload
      # Identity Federation — the read-scoped `github-ci` provider impersonating
      # the objectViewer-only co-pypi-reader SA — then sync before `uv sync`.
      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse
        run: uv run --no-project --with google-cloud-storage python scripts/sync_wheelhouse.py

      - name: uv sync
        run: uv sync --group dev

      # Independent migration smoke-check; conftest also runs upgrade inside
      # the session fixture (idempotent at head).
      - name: alembic upgrade head
        env:
          ARCHIVER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test
        run: uv run alembic upgrade head

      - name: pytest (default, excludes integration)
        run: uv run pytest -v -m "not integration"

      - name: pytest (integration)
        run: uv run pytest -v -m integration

  client-drift:
    name: client-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      # Regenerate each vendored generated client from its committed OpenAPI
      # snapshot and fail on any diff vs the committed generated/ tree — turns a
      # stale client (the #66 failure mode) into a red build. Stdlib-only driver
      # (--no-project skips the root sync); the per-SDK regen syncs that SDK's
      # own lockfile, pinning its openapi-python-client + ruff versions.
      - name: detect generated-client drift vs committed OpenAPI snapshot
        run: uv run --no-project --python 3.12 python scripts/check_client_drift.py

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    # pull-requests: read — the push branch resolves the merged PR's labels
    # via the commits/{sha}/pulls API so a `no-changelog` opt-out survives
    # the merge (archiver#91). Job-level grant; the workflow default is
    # contents-only.
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: require CHANGELOG.md on contract-visible changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HAS_OPT_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Path-based trigger — mirrors scripts/check_changelog_lib.sh CHANGELOG_TRIGGER_RE.
          # A CHANGELOG.md entry is required only when a contract-visible path changes:
          #   alembic/versions/  deployed DB migrations
          #   src/api/routes/    HTTP API surface
          #   src/api/schemas/   Pydantic request/response contract models
          #   clients/python/    archiver-client SDK
          # Dashboard, tests, docs, tooling changes never require an entry.
          TRIGGER_RE='^(alembic/versions/|src/api/routes/|src/api/schemas/|clients/python/)'
          ZERO=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HAS_OPT_OUT" == "true" ]]; then
              echo "no-changelog label set; skipping"
              exit 0
            fi
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
            if [[ "$base" == "$ZERO" || -z "$base" ]]; then
              echo "no prior SHA on push (initial or force-with-lease edge); skipping"
              exit 0
            fi

            # A labelled PR's `no-changelog` opt-out must survive the merge:
            # this push run has no label in the event payload, so resolve the
            # PR whose merge produced the pushed commit (merge, squash, and
            # rebase merges all leave merge_commit_sha == the pushed head) and
            # skip when it carries the label. No associated PR (direct push to
            # main) → empty label list → fall through to the path check,
            # preserving today's strictness. Fail OPEN on API errors: the
            # trailing `|| true` swallows any gh/jq failure so a network
            # hiccup degrades to the plain path check, never a crashed job.
            pr_labels="$(gh api "repos/${REPO}/commits/${head}/pulls" 2>/dev/null \
              | jq -r --arg sha "$head" \
                  '.[] | select(.merge_commit_sha == $sha) | .labels[].name' \
              || true)"
            if printf '%s\n' "$pr_labels" | grep -qx 'no-changelog'; then
              echo "merged PR carries the no-changelog label; skipping"
              exit 0
            fi
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          if printf '%s\n' "$changed_files" | grep -Eq "$TRIGGER_RE"; then
            if ! printf '%s\n' "$changed_files" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Contract-visible path changed without a CHANGELOG.md entry."
              echo "Matched trigger paths:"
              printf '%s\n' "$changed_files" | grep -E "$TRIGGER_RE" | sed 's/^/  /'
              echo
              echo "Update CHANGELOG.md, or apply the 'no-changelog' label to the PR"
              echo "(honored on the PR run and, via commit->PR lookup, on the merge push)."
              exit 1
            fi
          fi
          echo "changelog check OK"
