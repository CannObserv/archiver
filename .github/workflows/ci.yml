name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main (keep
# CI signal for every commit that lands on the protected branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test
      ARCHIVER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/archiver_test
      ARCHIVER_API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --group dev

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: pytest (default, excludes integration)
        run: uv run pytest -v -m "not integration"

      - name: pytest (integration)
        run: uv run pytest -v -m integration

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: require CHANGELOG.md on feat/fix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HAS_OPT_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Mirror of scripts/check_changelog_on_push.sh PATTERN — keep in sync.
          # Accepts feat[!]:, fix[!]:, with optional (scope) and `#<n> ` prefix.
          PATTERN='^(#[0-9]+ )?(feat|fix)(\([^)]+\))?!?:'
          ZERO=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HAS_OPT_OUT" == "true" ]]; then
              echo "no-changelog label set; skipping"
              exit 0
            fi
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            msgs="$(git log --format=%s "$base..$head"; printf '%s\n' "$PR_TITLE")"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
            if [[ "$base" == "$ZERO" || -z "$base" ]]; then
              echo "no prior SHA on push (initial or force-with-lease edge); skipping"
              exit 0
            fi
            msgs="$(git log --format=%s "$base..$head")"
          fi

          if echo "$msgs" | grep -Eq "$PATTERN"; then
            if ! git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
              echo "::error::feat/fix change without CHANGELOG.md update."
              echo "Offending subjects:"
              echo "$msgs" | grep -E "$PATTERN" | sed 's/^/  - /'
              echo
              echo "Update CHANGELOG.md, or apply the 'no-changelog' label (PR only)."
              exit 1
            fi
          fi
          echo "changelog check OK"
