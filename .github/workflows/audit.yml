name: audit

# uv.lock and clients/python/uv.lock against OSV (#420), ported from
# CannObserv/broker#86. Dependabot's uv ecosystem can't sync the private
# wheelhouse co-core resolves from (#192), so nothing else re-locks or audits.
#
# Report-only: scripts/audit_lock.sh always exits 0, and a finding is a warning
# annotation plus the job summary, runtime and dev under separate titles. A red
# gate here would turn main red on someone else's disclosure date. Push and PR
# runs read the locks a change ships; the weekly run reads the locks nobody
# touched, since disclosures arrive without commits.
#
# Its own workflow, not a ci.yml job: scripts/deploy.sh's CI gate reads ci.yml
# runs alone, so this never decides a deploy.
#
# No secret and no OIDC token: `uv audit --frozen` reads a lock without the
# wheelhouse, so it needs no WIF. tests/scripts/test_audit_lock.py pins this.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: uv audit (report-only)
    # The host's image, as ci.yml pins it (#192).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # --frozen downloads no package, so there is nothing to cache, and so
          # nothing to prune (tests/ci/test_workflow_pins.py).
          enable-cache: false

      - name: uv audit --frozen
        run: bash scripts/audit_lock.sh
