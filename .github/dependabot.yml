# Moves the action pins nothing else moves (#192): ci.yml pins every `uses:`
# to a commit SHA with a `# vX.Y.Z` comment, and setup-uv publishes no
# floating major to follow. Each PR is gated by ci.yml; a Dependabot run reads
# its own credential context, so the WIF auth step is the first thing to read
# on a red one. How one lands: docs/DEPLOYMENT.md -> "Dependabot".
#
# github-actions only. `uv` waits on #192's blocker 2: co-core resolves only
# from the private wheelhouse, which Dependabot's updater cannot sync. npm
# (`"latest"` specifiers) and gitsubmodule (deliberate skills-vendor/ bumps)
# stay out too.
# Guarded by tests/ci/test_dependabot.py: a mistyped config stops producing
# PRs without erroring anywhere a person looks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # scans .github/workflows/
    # Generated by install-cadence.sh; a re-render reverts any bump made in it
    # (gregoryfoster/skills#373). Its pin moves with the installer.
    exclude-paths:
      - ".github/workflows/context-cadence.yml"
    schedule:
      interval: "weekly"
    # The default is 5, and past it Dependabot opens nothing and says so
    # nowhere (notifier#103). One PR per action; the test derives the bound.
    open-pull-requests-limit: 10
    # CLAUDE.md's no-issue form: "chore: bump actions/checkout from 5.1.0 to 7.0.1".
    commit-message:
      prefix: "chore"
