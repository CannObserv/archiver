[project]
name = "archiver"
version = "4.49.1"
description = "Cannabis Observer Archiver service — central registry for Information Items, Information Sources, Source Revisions, and Replication Specifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-json-logger>=4.0.0,<5",
    "uvicorn>=0.34.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.15.0,<2",
    "python-ulid>=3.0.0,<4",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0,<7",
    "jsonschema>=4.21.0,<5",
    "httpx>=0.28.0,<1",
    "redis[hiredis]>=5,<8",  # co-core-aio[bus] already holds <8 (#192)
    "jinja2>=3.1.0,<4",
    "aiofiles>=24.1.0,<25",
    "python-multipart>=0.0.9,<1",
    "co-core[extract]>=0.53.4,<0.54",
    "co-core-aio[bus]>=0.53.4,<0.54",
    "archiver-client",
    "power-map-client",
    "notifier-client",
    "google-cloud-storage>=2,<4",  # the nightly backup's bucket (archiver#233)
]

[dependency-groups]
dev = [
    # tests/scripts/test_co_pypi_token.py signs a throwaway key with it (#498);
    # declared, not borrowed from google-auth's dependencies.
    "cryptography>=50,<51",
    "openapi-python-client>=0.21,<1",
    "packaging>=24,<27",           # tests/test_certifi_floor.py compares versions (archiver#418)
    "pre-commit>=4.5.1,<5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=6.0,<7",
    "pyyaml>=6,<7",                # tests/scripts parse .github/workflows/ci.yml (archiver#248)
    "respx>=0.22",
    "ruff>=0.16.8,<0.17",
    "fakeredis>=2.20",
]
# The real-browser tier (archiver#546): `uv run --group browser pytest -m browser`
# after `bash scripts/install_browser.sh`. Its own group, never dev and never a
# default group: deploy.sh syncs `--no-dev`, which drops dev alone. Capped below
# the next minor because each Playwright minor pins a new Chromium build.
browser = [
    "playwright>=1.65.2,<1.66",
]
# scripts/co_pypi_token.py's own dependency, locked (#498, as broker#144):
# scripts/co-pypi.sh runs it `--isolated --frozen --only-group co-pypi`, before
# any co-core file is fetched, so nothing in the process that holds the key is
# resolved at run time. Never a default group: no venv carries it.
co-pypi = ["google-auth[requests]>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# The host disk GC's repo-side knob (#440; maintaining-host-disk repo-knobs.md):
# one run's basetemp, failed tests' directories only.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = [
    "error::DeprecationWarning",
]
markers = [
    "integration: cross-component flow requiring TEST_DATABASE_URL + fakeredis; excluded from pre-ship via `-m \"not integration\"`, exercised separately in CI",
    "browser: real Chromium against a loopback server (tests/browser/, archiver#546); collected only when -m selects it or a path under tests/browser/ is named, so never in pre-ship or CI's default steps; run `uv run --group browser pytest -m browser` after `bash scripts/install_browser.sh`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 added `*.md` to the default `include`, so `format` now reaches the
# `python` fences inside documentation (#242). Markdown stays in scope — the
# live docs' samples are worth formatting — with two trees held out:
#
#   docs/plans/  dated snapshots of what was proposed at the time, not
#                maintained source; reformatting their samples rewrites a
#                record. CHANGELOG.md is dated too and stays IN scope: its
#                samples are migration guidance a reader runs today, where a
#                plan's are a closed record of what was once intended.
#   skills/      overrides quoting vendor skill text, and the tree where a
#                file-level symlink into skills-vendor/ lives. The main CI
#                workflow checks out no submodules, so ruff reading that link is
#                `io: No such file or directory` — a red build with no formatting
#                opinion in it. Holding the tree out rather than the one path
#                also keeps override text byte-comparable with its vendor, which
#                is what the re-sync merges in #243 diff against.
#
# clients/python/src/archiver_client/generated/ is NOT listed here: that tree
# carries its own [tool.ruff] table (clients/python/pyproject.toml), and a
# nested config is the one that governs the files beneath it — this entry never
# reached them. The exclusion lives there now; tests/scripts/test_ruff_config.py
# pins all of it.
exclude = ["skills/", "skills-vendor/", "docs/plans/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# PLC0415 enforces the AGENTS.md "no inline module imports" convention (#97).
# `if TYPE_CHECKING:` guards are module-level and not flagged. The vendored
# clients under clients/ resolve their own [tool.ruff] config and are unaffected;
# their generated code imports lazily to dodge circular imports.
extend-select = ["B904", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# A security floor on a transitive dependency: httpx and requests verify TLS
# against certifi's bundle, and 2026.10.19 drops eMudhra's compromised chain
# (archiver#418). tests/test_certifi_floor.py fails a lock below it.
constraint-dependencies = ["certifi>=2026.10.19"]

# The cannobserv packages' index (#498, as broker#144 and watcher#358; cannobserv
# RELEASING.md, Path C). The URL is the org registry's byte for byte, trailing
# slash included, so Dependabot matches it. Explicit: it serves only the names
# [tool.uv.sources] pins to it, so co-core never comes from PyPI and nothing else
# comes from here. uv.lock holds each file's sha256. Auth is a per-command token:
# `bash scripts/co-pypi.sh uv ...` (docs/DEPLOYMENT.md, The co-pypi index).
# Guard: tests/test_dependency_index.py.
[[tool.uv.index]]
name = "co-pypi"
url = "https://us-west1-python.pkg.dev/co-gcs/co-pypi/simple/"
explicit = true

[tool.uv.sources]
# Every cannobserv package is declared directly and pinned here: uv binds a
# source to a direct dependency only, so a transitive one would go to PyPI.
co-core = { index = "co-pypi" }
co-core-aio = { index = "co-pypi" }
archiver-client = { path = "clients/python", editable = true }
# Power Map's SDK (archiver#304): a git tag on a public repo, not the co-pypi index.
# Client and server share one version; upgrade path in docs/DEPLOYMENT.md.
power-map-client = { git = "https://github.com/CannObserv/power-map.git", subdirectory = "clients/python", tag = "v0.59.0" }
# Notifier's SDK (archiver#368): the same pattern. Async, lockstep with the server.
# Only src/core/notifier/ imports it, and it lists channels and nothing else.
notifier-client = { git = "https://github.com/CannObserv/notifier.git", subdirectory = "clients/python", tag = "v0.3.2" }
