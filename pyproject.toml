[project]
name = "archiver"
version = "3.2.0"
description = "Cannabis Observer Archiver service — central registry for Information Items, Information Sources, Source Revisions, and Replication Specifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-json-logger>=4.0.0,<5",
    "uvicorn>=0.34.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.15.0,<2",
    "python-ulid>=3.0.0,<4",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0,<7",
    "pypdf>=5.0,<7",
    "openpyxl>=3.1.0,<4",
    "jsonschema>=4.21.0,<5",
    "httpx>=0.28.0,<1",
    "html5lib>=1.1",
    "redis[hiredis]>=5",
    "archiver-client",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21,<1",
    "pre-commit>=4.5.1,<5",
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=6.0,<7",
    "respx>=0.22",
    "ruff>=0.15.0,<0.16",
    "fakeredis>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["skills-vendor/", "clients/python/src/archiver_client/generated/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
extend-select = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
archiver-client = { path = "clients/python", editable = true }
