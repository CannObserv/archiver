[project]
name = "archiver-client"
version = "5.7.0"
description = "Async Python SDK for the Archiver service. Generated from the service's OpenAPI schema."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1",
    "python-ulid>=3.0.0,<4",
    "attrs>=24",                   # required by openapi-python-client output
    "python-dateutil>=2.9",        # required by openapi-python-client output
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22",
    "openapi-python-client>=0.21,<1",
    "ruff>=0.16.8,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["src/archiver_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly, mirroring the root config (#242). This table — not the
# root one — governs every file under clients/python/, so with no `select` the
# SDK tracked ruff's *default* rule set: 0.16 widening those defaults surfaced
# 91 findings in code nobody had touched. Pinning the selection here is what
# makes a ruff release a version bump rather than a rule change.
#
# PLC0415 is the one root rule deliberately not carried over: the generated
# code imports lazily to dodge circular imports.
select = ["E", "F", "I", "W", "UP"]
extend-select = ["B904"]
# The generated tree is regenerated, never hand-edited, so linting it reports on
# openapi-python-client's output rather than on anything anyone can fix here.
# Lint-only by design: `ruff format` must still reach it, because
# scripts/regen.sh and the client-drift gate (scripts/check_client_drift.py)
# both format it and compare the result against the committed tree.
# A `lint.exclude` pattern is matched against each file path rather than
# pruning the walk, so the directory prefix alone matches nothing — the `/**`
# is load-bearing.
exclude = ["src/archiver_client/generated/**"]

[tool.ruff.lint.per-file-ignores]
# Generated endpoint module names exceed 100 chars; no way to shorten import aliases.
"src/archiver_client/client.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
