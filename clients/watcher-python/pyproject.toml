[project]
name = "watcher-client"
version = "1.2.0"
description = "Async Python SDK for the Watcher service. Generated from the service's OpenAPI schema."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1",
    "attrs>=24",                   # required by openapi-python-client output
    "python-dateutil>=2.9",        # required by openapi-python-client output
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22",
    "openapi-python-client>=0.21,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_client"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/watcher_client/client.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
