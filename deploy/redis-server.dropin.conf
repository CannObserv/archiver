# Archiver-owned tuning for the shared Redis change-bus broker (archiver#109).
#
# Archiver operates redis-server as the `info.changes` change-bus producer and
# cluster control-plane. This drop-in LAYERS on the stock Debian
# redis-server.service — it does NOT replace the package unit. Install:
#
#   sudo mkdir -p /etc/systemd/system/redis-server.service.d
#   sudo cp deploy/redis-server.dropin.conf \
#       /etc/systemd/system/redis-server.service.d/archiver.conf
#   sudo systemctl daemon-reload && sudo systemctl restart redis-server
#
# It overrides ExecStart to append persistence + eviction flags as CLI args
# (which override the same directives in /etc/redis/redis.conf), so the
# package's redis.conf stays untouched and everything Archiver tunes lives in
# this one tracked file.
#
# Durability: AOF (appendfsync everysec) makes the stream + consumer-group state
# survive a broker restart. The Archiver outbox stays the producer-side source of
# truth; AOF covers consumer-side in-flight state once Replicator (Phase 3)
# consumes. maxmemory-policy noeviction: a stream broker must never silently evict
# entries under memory pressure — better to error and let the outbox retry.
#
# An explicit --maxmemory (archiver#128): noeviction WITHOUT a cap is inert.
# With the default `maxmemory 0` there is no ceiling to refuse writes at, so an
# untrimmed stream does not produce the retryable write errors this drop-in's
# noeviction line assumes — it grows until the kernel OOM-killer takes
# redis-server, costing the whole broker plus an AOF-replay restart. The cap
# restores the intended failure mode: bounded, instance-wide `OOM command not
# allowed` errors that the Archiver outbox retries through (that error is
# classified TRANSIENT in src/core/changes/publisher.py — the two must stay in
# step). Note the blast radius is instance-wide: every producer on this broker is
# refused, and only Archiver's is known to retry (see deploy/README.md).
#
# Sizing: ~780 bytes/entry on info.changes, so its 100k-entry
# ARCHIVER_REDIS_STREAM_MAXLEN default is ~78MB; the value on the ExecStart line
# below leaves roughly 6x headroom for the other streams on this shared broker
# while staying far under the 7.2Gi host shared with Postgres. That line is the
# single authoritative statement of the value — deliberately not repeated here or
# in deploy/README.md, so there is nothing to drift. Raise it if the stream
# inventory in deploy/README.md grows; it is a ceiling, not a reservation.
#
# NOTE: the ExecStart below reproduces the stock unit's command
#   /usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no
# (verified via `systemctl show redis-server -p ExecStart`). If a distro upgrade
# changes that command, refresh this line to match.
[Service]
ExecStart=
ExecStart=/usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --maxmemory 512mb
