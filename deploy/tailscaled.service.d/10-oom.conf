# tailscaled's place in the kernel's OOM order (archiver#285). Install to
# /etc/systemd/system/tailscaled.service.d/; see deploy/README.md.
#
# It carries archiver's bus (redis://…@broker over the tailnet) and MagicDNS,
# and a failing tailscaled was a named symptom of CannObserv/broker's 2026-09-16
# outage. Stock it sits at 0, level with the sessions and ahead of everything
# production. Below them now, but behind archiver.service's -500, as on watcher
# (#309): the API and dashboard are reached through the exe.dev proxy, not the
# tailnet, and the outbox buffers a bus outage, so archiver should outlive the
# tunnel. Applies at exec - restart tailscaled, or `choom -p` its MainPID.
[Service]
OOMScoreAdjust=-400
