# Memory floor for the one PostgreSQL cluster (archiver#237).
#
# Install to /etc/systemd/system/postgresql@16-main.service.d/; see
# deploy/README.md. It targets this instance, not every instance through
# postgresql@.service.d/: a second cluster would claim a second floor the
# slices above do not grant.
#
# The registry is only as protected as its database: archiver.service's floor
# keeps its own pages resident, and a request still stalls on a reclaimed page
# of the cluster behind it. Sized above the measured peak, 281 MiB on
# 2026-09-28 (memory.peak after 2.7 days up). The cluster also serves
# archiver_dev and archiver_test; one cluster can only have one floor.
#
# No OOMScoreAdjust= here: Debian's postgresql@.service already sets -900.
[Service]
MemoryLow=320M
