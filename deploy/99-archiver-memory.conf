# Atomic-allocation reserve for archiver's host (archiver#237).
#
# Install to /etc/sysctl.d/99-archiver-memory.conf; see deploy/README.md.
#
# MemoryLow= and OOMScoreAdjust= are cgroup properties, and neither can help
# an allocation made in interrupt context - which is what failed on
# CannObserv/broker on 2026-09-16: the kernel failed atomic allocations in
# tailscaled and ksoftirqd, nothing was OOM-killed, and the bus was down
# 57m 48s (gregoryfoster/skills#295, troubleshooting.md row U).
#
# The kernel default scales off RAM and read 7999 kB on this 3.8 GiB host.
# With no swap there is no slow path, so this reserve is the only buffer
# between a spike and an allocation failure somewhere unrelated.
#
# 64 MiB is ~1.7% of RAM, the cohort's figure (notifier, watcher, replicator).
# The reserve is memory nothing else may use, so past a few percent it causes
# the reclaim pressure it exists to relieve.
vm.min_free_kbytes = 65536
