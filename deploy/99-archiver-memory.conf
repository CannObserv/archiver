# Atomic-allocation reserve and swap posture for archiver's host (archiver#237,
# archiver#286).
#
# Install to /etc/sysctl.d/99-archiver-memory.conf; see deploy/README.md.
#
# MemoryLow= and OOMScoreAdjust= are cgroup properties, and neither can help
# an allocation made in interrupt context - which is what failed on
# CannObserv/broker on 2026-09-16: the kernel failed atomic allocations in
# tailscaled and ksoftirqd, nothing was OOM-killed, and the bus was down
# 57m 48s (gregoryfoster/skills#295, troubleshooting.md row U).
#
# The kernel default scales off RAM as 4 x sqrt(lowmem kB): it read 7999 kB at
# 3.8 GiB, and computes to ~11 MB at 7.7 GiB (this drop-in masks the reading).
# Swap gives reclaim a slow path, but an atomic allocation cannot wait for it,
# so this reserve is still the only buffer between a spike and an allocation
# failure somewhere unrelated.
#
# 64 MiB is the cohort's absolute figure (notifier, watcher, replicator), not a
# share of RAM: replicator kept it at 7.75 GiB (CannObserv/replicator#99), and
# an atomic burst does not grow with the host. The reserve is memory nothing
# else may use, so past a few percent it causes the reclaim pressure it exists
# to relieve.
vm.min_free_kbytes = 65536

# The 4 G /swapfile (deploy/README.md) is a last resort, not working space.
# Reclaim weighs anonymous pages against page cache as swappiness : 200 -
# swappiness, scaled by each side's recent reclaim cost (mm/vmscan.c,
# get_scan_count): 60:140 at the default, 10:190 here, so anonymous memory is
# scanned ~1/19 as hard as cache. Some swap use is expected, not a symptom.
# That is the classic LRU's rule; multi-gen LRU weighs swappiness differently
# and is off here (/sys/kernel/mm/lru_gen/enabled reads 0x0000).
# replicator's figure (CannObserv/replicator#99).
vm.swappiness = 10
