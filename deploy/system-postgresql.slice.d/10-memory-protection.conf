# The grant postgresql@16-main.service's MemoryLow= draws on (archiver#237).
#
# Install to /etc/systemd/system/system-postgresql.slice.d/; see
# deploy/README.md. `systemctl daemon-reload` applies it, with no restart.
#
# A template instance runs in an implicit system-<template>.slice that systemd
# creates with no settings, so it grants 0 and clamps the unit below it. This
# host's cgroup2 mount lacks memory_recursiveprot, so system.slice's grant does
# not pass through on its own (host-memory.md section 3; on address-validator
# postgres stayed unprotected until this link had its own grant).
#
# Exactly postgresql@16-main.service's claim; it is the only cluster.
[Slice]
MemoryLow=320M
