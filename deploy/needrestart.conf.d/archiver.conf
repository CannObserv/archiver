# archiver#278: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# libc6 or libxml2 security update would then restart postgresql@16-main, and
# a python3.12 one archiver.service, mid-apply and without the owner's
# approval. With the key set, needrestart prints "Disabling Ubuntu mode,
# explicit restart mode configured" and only lists. Same shape as
# CannObserv/broker ad03a3d (broker#65).
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
