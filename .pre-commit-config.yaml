# pre-commit hooks for archiver
#
# Install once per checkout: `uv run pre-commit install`
#   (installs both pre-commit and pre-push hook types via default_install_hook_types)
# Run manually: `uv run pre-commit run --all-files`
#
# Hooks run on `git commit` (pre-commit) and `git push` (pre-push).
# Failed hooks abort the operation; fix and re-stage / re-push.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: ruff-format
        name: ruff format
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: end-of-file-fixer
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: changelog-required
        name: require CHANGELOG.md on feat/fix when pushing to main
        language: system
        entry: scripts/check_changelog_on_push.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
