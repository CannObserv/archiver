# pre-commit hooks for archiver
#
# Install once per checkout: `uv run pre-commit install`
#   (installs both pre-commit and pre-push hook types via default_install_hook_types)
# Run manually: `uv run pre-commit run --all-files`
#
# Hooks run on `git commit` (pre-commit) and `git push` (pre-push).
# Failed hooks abort the operation; fix and re-stage / re-push.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pin in pyproject.toml — a skew here means the
    # commit-time hook and CI disagree about what is an error (#242).
    # tests/scripts/test_ruff_config.py fails when they drift apart.
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
        exclude: ^(skills/|skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: ruff-format
        name: ruff format
        # No generated/ here, deliberately: the SDK config excludes that tree
        # from lint only, because scripts/regen.sh and the client-drift gate
        # both format it and diff the result against the committed one. A hook
        # that skipped it would disagree with both (#242 CR 1).
        exclude: ^(skills/|skills-vendor/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: end-of-file-fixer
        exclude: ^(skills-vendor/|clients/python/src/archiver_client/generated/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: changelog-required
        name: require CHANGELOG.md on contract-visible changes when pushing to main
        language: system
        entry: scripts/check_changelog_on_push.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: test-changelog-lib
        name: test changelog trigger logic
        language: system
        entry: bash scripts/test_check_changelog.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
